name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的后续推送取消之前的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Docs + Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # commitlint 需要完整的提交历史来确定检查范围
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # 自动从 package.json 的 packageManager 字段读取版本

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify docs
        run: pnpm verify:docs

      # 结构不变量：ZodValidationPipe 挂载、forFeature contextName、strip-only 源、server ESM 约束
      - name: Verify invariants
        run: pnpm verify:invariants

      # 门禁自监控：门禁/hook 脚本语法、hooks.json 结构、hook 活体冒烟
      - name: Verify gates
        run: pnpm verify:gates

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.sha }}"

      # turbo 按任务图并行执行 lint/typecheck/test
      - name: Lint + Typecheck + Test
        run: pnpm turbo lint typecheck test

      # e2e 不依赖真实 DB（readiness 断言 503；auth-me 真实登录用例凭据缺失自动 skip）
      - name: E2E (server)
        run: pnpm --filter server test:e2e

      # knip（死代码/未用依赖）+ publint（包 exports 正确性），见 .agents notes 与 iteration-plan 1.3
      - name: Hygiene (knip + publint)
        run: pnpm hygiene

      # build 消费 dotenv 链（.env.local/.env.production/.env，git-ignored）。
      # CI 用 .env.example 的占位值显式供源：构建物里的 NUXT_PUBLIC_* 为模板默认值，
      # 与本地构建的差异只在配置内联值，不在编译可行性
      - name: Build
        run: |
          cp .env.example .env
          pnpm build
        env:
          # Electron 构建可能需要这些环境变量
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
