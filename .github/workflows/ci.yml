name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的后续推送取消之前的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本工作流只需要读代码（无发布/写操作）
permissions:
  contents: read

# 检查按关注点拆成独立 job 并行执行：各自红绿、各自日志，
# 一个失败不再遮蔽其余检查（单 job 串行的教训见 2026-09-13 teardown 的 CI 排障）。
# 注意：本地 composite action（./.github/actions/setup）在执行时才从磁盘解析，
# 因此每个 job 必须先跑顶层 actions/checkout，再引用它。
jobs:
  verify:
    name: Docs + Invariants + Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm verify:docs
      - run: pnpm verify:invariants
      - run: pnpm verify:gates

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo typecheck

  test:
    name: Test (coverage gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # nuxt 环境测试依赖 .nuxt 生成物（~/、#app 别名解析）；CI 干净 checkout 需显式 prepare
      - run: pnpm --filter desktop exec nuxt prepare
      # test:coverage 同时执行全部测试并检查各包覆盖率阈值
      - run: pnpm turbo test:coverage

  e2e:
    name: E2E (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # e2e 不依赖真实 DB（readiness 断言 503；auth-me 真实登录用例凭据缺失自动 skip）
      - run: pnpm --filter server test:e2e

  hygiene:
    name: Hygiene (knip + publint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # knip 解析 desktop 测试的 Nuxt 别名（~/、#app）同样依赖 .nuxt 生成物
      - run: pnpm --filter desktop exec nuxt prepare
      # knip（死代码/未用依赖）+ publint（包 exports 正确性），见 .agents notes 与 iteration-plan 1.3
      - run: pnpm hygiene

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # build 消费 dotenv 链（.env.local/.env.production/.env，git-ignored）。
      # CI 用 .env.example 的占位值显式供源：构建物里的 NUXT_PUBLIC_* 为模板默认值，
      # 与本地构建的差异只在配置内联值，不在编译可行性
      - name: Build (desktop + server)
        run: |
          cp .env.example .env
          pnpm build
        env:
          # Electron 构建可能需要这些环境变量
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # commitlint 需要完整提交历史确定检查范围；仅 PR 触发（push 到 main 单提交不查）
  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.sha }}"
