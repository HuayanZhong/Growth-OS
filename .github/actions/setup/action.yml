name: 'Setup'
description: 'pnpm/Node 工具链 + 依赖安装（前置要求：job 里已先执行 actions/checkout）'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      # 自动从 package.json 的 packageManager 字段读取版本
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
