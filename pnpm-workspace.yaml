packages:
  # 应用目录
  - 'apps/*'
  # 文档目录
  - 'docs/*'
  # 包目录
  - 'packages/*'
  # 共享配置目录
  - 'tooling/*'

allowBuilds:
  esbuild: true

catalogs:
  # 开发目录
  dev:
    '@types/node': ^26.1.1
    turbo: ^2.10.7
    typescript: 6.0.3

  # 前端依赖
  frontend:
    '@tauri-apps/api': ^2.11.1
    '@tauri-apps/cli': ^2.11.4
    '@tauri-apps/plugin-opener': ^2.5.4
    '@vitejs/plugin-vue': ^5.2.4
    vite: ^6.4.3
    vue: ^3.5.40
    vue-tsc: ^2.2.12
