packages:
  # 应用目录
  - 'apps/*'
  # 文档目录
  - 'docs/*'
  # 包目录
  - 'packages/*'
  # 共享配置目录
  - 'tooling/*'

allowBuilds:
  # @scarf/scarf 是 @nestjs/swagger 的遥测依赖，postinstall 仅上报，跳过（不影响功能）
  '@scarf/scarf': false
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true

catalogs:
  # 开发目录
  dev:
    '@commitlint/cli': ^21.2.1
    '@commitlint/config-conventional': ^21.2.0
    '@types/node': ^26.1.1
    '@types/pg': ^8.21.0
    dotenv-cli: ^11.0.0
    husky: ^9.1.7
    lint-staged: ^17.2.0
    turbo: ^2.10.7
    typescript: 6.0.3
    pino-pretty: ^13.0.0
  # 代码检查目录
  lint:
    oxlint: ^1.76.0
    oxlint-tailwindcss: ^1.5.0
  # 格式化目录
  format:
    oxfmt: ^0.61.0
  # 前端依赖
  frontend:
    electron: ^43.2.0
    electron-builder: ^26.15.3
    electron-updater: ^6.8.9
    nuxt: ^4.5.1
    vue: ^3.5.40
    vue-router: ^5.2.0
    vite-plugin-electron: ^1.1.0
    tailwindcss: ^4.3.3
    '@tailwindcss/vite': ^4.3.3
    daisyui: ^5.7.4
    gsap: ^3.15.0
    '@supabase/supabase-js': ^2.111.0
    clsx: ^2.1.1
    tailwind-merge: ^3.6.0
    vue-tsc: ^3.3.8
    '@nuxt/kit': ^4.5.1
  # 测试依赖
  test:
    vitest: ^4.1.10
    '@nuxt/test-utils': ^4.1.0
    '@vue/test-utils': ^2.4.11
    happy-dom: ^20.11.1
    jest: ^30.4.2
    ts-jest: ^29.4.12
    '@types/jest': ^30.0.0
    supertest: ^7.2.2
    '@types/supertest': ^7.2.1
  # 后端依赖
  backend:
    '@nestjs/common': ^11.1.19
    '@nestjs/core': ^11.1.19
    '@nestjs/platform-express': ^11.1.19
    '@nestjs/config': ^4.0.2
    '@nestjs/cli': ^11.0.7
    '@nestjs/schematics': ^11.0.5
    '@nestjs/testing': ^11.1.19
    reflect-metadata: ^0.2.2
    rxjs: ^7.8.2
    '@types/express': ^5.0.0
    class-validator: ^0.15.1
    class-transformer: ^0.5.1
    '@mikro-orm/core': ^7.1.11
    '@mikro-orm/nestjs': ^7.0.2
    '@mikro-orm/postgresql': ^7.1.11
    '@mikro-orm/cli': ^7.1.11
    tsx: ^4.23.12
    '@mikro-orm/migrations': ^7.1.11
    '@mikro-orm/decorators': ^7.1.11
    '@mikro-orm/reflection': ^7.1.11
    '@mikro-orm/seeder': ^7.1.11
    jose: ^5.10.0
    nestjs-pino: ^4.6.1
    pino: ^10.3.1
    '@nestjs/throttler': ^6.5.0
    compression: ^1.8.1
    '@types/compression': ^1.8.1
    helmet: ^8.0.0
    '@nestjs/swagger': ^11.0.0
  # 跨包共享依赖（前后端通用）
  shared:
    zod: ^4.4.3
